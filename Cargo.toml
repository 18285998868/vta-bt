[workspace]

[package]
name = "vta"
version = "0.1.0"
edition = "2024"
authors = ["NautilusTrader Developer"]
license = "MIT"

[dependencies]
vector-ta = "0.3"
reader = { path = "../reader" }
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
toml = "1.1"
arrow = "59"
parquet = { version = "59", features = ["arrow"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
