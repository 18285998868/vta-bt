[workspace]

[package]
name = "tradingview-backend"
version = "0.1.0"
edition = "2024"
authors = ["NautilusTrader Developer"]
license = "MIT"

[[bin]]
name = "tradingview"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs"] }
toml = "1.1"
dotenvy = "0.15"
moka = { version = "0.12", features = ["sync"] }
kline-reader = { path = "../libs/kline-reader" }
vta = { path = "../vector-ta" }
# vector-ta 与 vta 同源：path 依赖指向 creats/libs/VectorTA（0.3.2，含 atma/edma），
# 保证 overlay 与 vta 信号同一实现算出。改动任一边前先 diff 已用的 MA / BollingerBands。
vector-ta = { path = "../libs/VectorTA" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zip = { version = "8", features = ["deflate"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
