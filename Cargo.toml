[workspace]

[package]
name = "vta"
version = "0.1.0"
edition = "2024"
# **刻意不声明 `rust-version`**: 本项目目标是"永远用最新 stable"(见
# `rust-toolchain.toml` 的 `channel = "stable"`)。`rust-version` 是**最低支持
# 版本**的下限声明, 与该目标直接冲突:
#   1. 它允许 cargo 用更老的工具链构建 —— 鼓励版本漂移;
#   2. `clippy::incompatible_msrv` 会拦截任何**比声明更新**的 API —— 恰好挡住
#      "用上最新 Rust"这件事本身;
#   3. 它需要随每次 stable 升级手工跟进, 迟早成为过期信息。
# 下限由 `rust-toolchain.toml` 隐式表达: 只会用最新 stable。
#
# 代码里用到的较新 API: `u32::isolate_lowest_one`(1.97 稳定, pbo.rs 的 Gosper hack)、
# `u32::is_multiple_of`(1.87 稳定, pbo.rs)。用最新 stable 时两者均可用。
authors = ["NautilusTrader Developer"]
license = "MIT"
# `description` 是 crates.io 发布的**必填项**; `readme` 让包主页有完整说明。
description = "向量化的技术指标批量回测框架: (品种 × 周期 × 策略 × 参数网格) → Parquet 报告, 内含 PBO/CSCV 过拟合检验"
readme = "README.md"
keywords = ["backtest", "quant", "trading", "technical-indicators", "parquet"]
categories = ["command-line-utilities", "science"]

[dependencies]
# 注意: 均为 **workspace path 依赖**(见 [workspace.dependencies])。
# 不用 crates.io 版本是为了保证指标实现与回测口径逐位一致 —— 换一个 patch 版本就可能
# 改变 NaN 前缀长度, 进而改变全部历史回测结果。
vector-ta = { workspace = true }
binance-data-reader = { workspace = true }
dukascopy-data-reader = { workspace = true }
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
toml = "1.1"
arrow = "60"
parquet = { version = "60", features = ["arrow"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
# 货币金额用定点十进制(不用 f64): 见 src/money.rs 的口径说明。
rust_decimal = "1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[workspace.dependencies]
# 指标库用 crates.io 发布版, 版本由 Cargo.lock 锁定; 两个 reader 是 /data 下的
# 独立仓库, 用相对路径保证同机可复现。
vector-ta = "0.3.1"
binance-data-reader = { path = "../binance-data-reader" }
dukascopy-data-reader = { path = "../dukascopy-data-reader" }

# 统一 lint 门禁: CI 与本地 `cargo clippy -- -D warnings` 行为一致。
[workspace.lints.rust]
unsafe_code = "forbid"
# 公开 API 必须有文档: 本地 `cargo clippy` 即报, 不必推到 CI 才发现。
missing_docs = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# panic 家族在**生产代码**里一律编译期可见: unwrap/expect/panic 只允许出现在
# 表达"内部不变量被破坏"的少数几处(带 `#[allow]` + 理由注释),
# 以及测试代码(测试模块整体放行)。
# 这条门禁直接把"该返回 Err 却 panic"这类问题挡在 CI 之前。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# `needless_range_loop` 在测试夹具里噪音大, 但生产代码应遵守; 故不全局开。
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"

# 刻意**不设** `panic = "abort"`: `zero_delay_is_rejected_at_every_entry_point` 用
# `catch_unwind` 断言 from_bps(0) 会 panic, abort 会让该测试无法观测。
[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3