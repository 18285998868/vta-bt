# ========================================
# 数据源配置
# ========================================
[data]
# 必须, 数据源类型: "binance" | "dukascopy"
type = "binance"
# 必须, K线数据目录
dir = "/data/nutilustrader/data/futures/um/daily/klines"
# 必须, 回测品种
# 可为单值或数组: symbol = "BTCUSDT" / symbol = ["BTCUSDT", "ETHUSDT"]
symbol = "BTCUSDT"
# 必须, 回测时间帧
# 可选值: "1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "6h", "8h", "12h", "1d"
# 可为单值或数组: timeframe = "15m" / timeframe = ["15m", "1h"]
timeframe = "1d"
# 注: symbol × timeframe × strategy 块 × 每块参数数 = 总试验次数 N,
#     N 越大则噪声底线越高(需更高夏普才可能显著), 故建议收敛规模而非全市场扫描。
# 可选, 数据起始日期 (格式: "YYYY-MM-DD"), 默认: None (全部数据)
# start_date = "2024-01-01"
# 可选, 数据结束日期 (格式: "YYYY-MM-DD"), 默认: None (全部数据)
# end_date = "2024-12-31"

# ========================================
# 回测配置
# ========================================
[backtest]
# 必须, 初始资金
initial_balance = 10000.0
# 可选, 信号到成交的延迟(bar 数), 默认 0
#   0 = 信号当根收盘成交(旧口径, 前视乐观, 仅用于复现历史结果)
#   1 = 信号次根 fill bar 成交(推荐, 消除同 bar 前视; 成交价见 fill_bar_price)
# delay_bars = 1
# 可选, delay>0 时 fill bar 的成交价, 默认 "open"(次根开盘); "close" 为次根收盘(多等一根 bar 内漂移)
# fill_bar_price = "close"
# 可选, 单边佣金(bp), 默认 0。如 taker 2bp 填 2.0, maker 零费填 0
# fee_bps = 2.0
# 可选, 单边逆向滑点(bp), 默认 0。买入抬价、卖出压价, 与佣金叠加扣除
# slippage_bps = 1.0

# ========================================
# 输出配置
# ========================================
[output]
# 可选, 输出目录, 默认: "reports"
dir = "/data/nutilustrader/reports/vta"
# 可选, 是否导出逐笔交易详细数据, 默认: false
detail = false
# 可选, 是否覆盖已存在的回测结果, 默认: false (跳过已完成的组合)
overwrite = false

# ========================================
# 策略配置
# 每个 [[strategy]] 块定义一个策略
# type: 必须, 策略类型 (见下方列表)
# period: 必须, 参数范围
#   单值: period = 20
#   范围: period = { start = 1, end = 1000, step = 1 }
#
# 支持的策略类型:
#   sma, ema, dema, tema, hma, zlma, alma, fwma, jma,
#   kama, lin_reg, mc_ginley, pwma, sin_wma, swma,
#   tilson, trima, vidya, vwma, wilders, wma, ssf, ssf_st
# ========================================

[[strategy]]
type = "alma"
period = { start = 1, end = 1000, step = 1 }

